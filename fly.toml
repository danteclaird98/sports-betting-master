app = 'edgeodds-danteclaird'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '3000'
  COOKIE_SECURE = 'true'
  ALLOWED_HOSTS = 'edgeodds-danteclaird.fly.dev'
  EDGEBOARD_DB = '/var/data/edgeboard.sqlite3'
  EDGEFUSION_DB = '/var/data/edgefusion.sqlite3'

[deploy]
  strategy = 'immediate'

[[mounts]]
  source = 'edgeboard_data'
  destination = '/var/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

    [http_service.checks.headers]
      Host = 'edgeodds-danteclaird.fly.dev'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
