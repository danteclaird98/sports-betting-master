<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Research Desk</title><link rel="stylesheet" href="/style.css"><body>
<header><h1>Sports Research Desk</h1><p>Research • Tracking • Evidence</p><span class="badge">No live provider · No evaluated models · Execution disabled</span></header>
<section id="login"><label>Access token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><p>Token stays in memory for this page only.</p></section>
<main hidden id="app"><nav id="nav"></nav><section class="tools"><label>Time zone <select id="zone"><option>America/Los_Angeles</option><option>UTC</option><option>America/New_York</option></select></label><label>Filter <input id="filter" placeholder="Sport, market, book or event"></label><button id="refresh">Refresh</button><button id="logout">Sign out</button></section><h2 id="heading"></h2><p id="note"></p><div id="view"></div><section id="entry"><h3 id="entryTitle"></h3><p id="entryNote"></p><label>Record type <select id="recordType"><option value="quote">Quote</option><option value="state">Live state</option><option value="wager">Wager</option><option value="settlement">Settlement</option><option value="limits">Limits</option></select></label><label>Editor <select id="editorMode"><option value="fields">Entry fields</option><option value="json">Advanced JSON</option></select></label><form id="fields"></form><textarea id="json" rows="18" spellcheck="false"></textarea><button id="submit">Save record</button><p id="result" role="status"></p></section></main><p id="error" role="alert"></p><script src="/ui.js"></script></body></html>
