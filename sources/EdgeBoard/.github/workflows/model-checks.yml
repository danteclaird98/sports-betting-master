name: Corrected receiving model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/correctedReceiving.test.ts tests/historicalCohort.test.ts
      - run: python -B -m unittest discover -s research/receiving60 -p test_pipeline.py -v
