name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:sources
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:models
      - run: python3 -m unittest discover -s edgeodds/tests -v
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s apps/edgeboard/research/receiving60 -v
      - run: node --check web/app.js
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Gitleaks
        run: |
          curl --fail --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {$2="gitleaks.tar.gz"; print}' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz checksums.txt
      - name: Scan working tree without printing secret values
        run: ./gitleaks dir . --redact=100 --no-banner
