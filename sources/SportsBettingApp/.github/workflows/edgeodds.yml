name: EdgeOdds

on:
  push:
    paths:
      - "edgeodds/**"
      - ".github/workflows/edgeodds.yml"
  pull_request:
    paths:
      - "edgeodds/**"
      - ".github/workflows/edgeodds.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run EdgeOdds regression tests
        run: python -m unittest discover -s edgeodds/tests -v
